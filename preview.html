<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f3"><title>Common Ground · Citizen assistance</title><link rel="stylesheet" href="./src/styles.css"><style>#mobile-nav:not([hidden]){display:flex}</style></head>
<body><div class="app-shell">
  <div class="prototype-strip"><span><span class="strip-dot"></span>Hackathon prototype · Demo information only</span><span class="strip-right">◈ &nbsp;Your privacy matters <span class="strip-divider"></span><button class="lang-button" id="language">தமிழ்⌄</button></span></div>
  <header class="site-header"><button class="brand" data-page="home"><span class="brand-mark"><span></span><span></span><span></span></span><span>common<span class="brand-light">ground</span></span></button><nav class="desktop-nav" aria-label="Main navigation" id="nav"></nav><button class="mobile-menu" id="menu" aria-expanded="false" aria-label="Open menu">☰</button><button class="header-help" data-page="help">? &nbsp;Ask for help</button><nav class="mobile-nav" id="mobile-nav" hidden></nav></header>
  <main id="main-content"></main><footer class="site-footer"><div class="footer-brand"><span class="brand-mark"><span></span><span></span><span></span></span><span>commonground</span></div><span>Made for people, with care.</span><button data-page="help">Need a hand? ↗</button></footer>
</div>
<script>
const labels={en:['Home','Report a problem','Track a request','Find a service','Alerts','Ask for help'],ta:['முகப்பு','பிரச்சினையைப் புகாரளி','கோரிக்கையைத் தொடர்க','சேவையைத் தேடு','எச்சரிக்கைகள்','உதவி கேள்']};
const pages=['home','report','track','services','alerts','help'];let lang='en',current='home',selected='',photoData='';let records=[];try{records=JSON.parse(localStorage.getItem('common-ground-demo-complaints')||'[]')}catch{}
const sample={ref:'DEMO-24A7KQ',category:'Broken streetlight',location:'Lake Road, Ward 4',description:'Streetlight near the bus stop is not working.',submitted:'18 Oct 2026 · 10:30 AM',status:'In Progress'};
const services=[['Local services','Public works and road maintenance','Explore where road and street maintenance information may be published.','Check your local authority’s official website for a verified reporting channel.'],['Public information','Local public service directory','A place to look for contact details and service hours published by a local authority.','Search the official website for your city, district or local council.'],['Schemes','Government scheme information','Scheme rules vary by programme and location. This prototype does not show eligibility or benefit details.','Use the relevant government department’s official website to check current information.'],['Local services','Waste collection and sanitation','Look for collection schedules and sanitation service information from your local authority.','Check an official local source for service details in your area.']];
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nav(){document.querySelector('#nav').innerHTML=labels[lang].map((x,i)=>`<button class="nav-link ${pages[i]===current?'active':''}" data-page="${pages[i]}">${x}</button>`).join('');document.querySelector('#mobile-nav').innerHTML=labels[lang].map((x,i)=>`<button data-page="${pages[i]}">${x}<span>→</span></button>`).join('');document.querySelector('#language').textContent=lang==='en'?'தமிழ்⌄':'English⌄';document.querySelector('#menu').setAttribute('aria-expanded',!document.querySelector('#mobile-nav').hidden)}
function go(p){current=p;document.querySelector('#mobile-nav').hidden=true;nav();render();scrollTo({top:0,behavior:'smooth'})}
function heading(k,title,intro){return `<div class="page-heading"><span class="eyebrow">${k}</span><h1>${title}</h1><p>${intro}</p></div>`}
function render(){const root=document.querySelector('#main-content');if(current==='home')root.innerHTML=`<section class="welcome-section"><div class="welcome-copy"><span class="eyebrow"><span class="eyebrow-dot"></span>${lang==='en'?'A little help, when you need it':'தேவைப்படும் போது சிறிய உதவி'}</span><h1>${lang==='en'?'Your community, supported.':'உங்கள் சமூகத்திற்கு ஆதரவு.'}</h1><p>${lang==='en'?'A simpler place to find services, report local problems and get clear next steps.':'சேவைகளைத் தேடவும், உள்ளூர் பிரச்சினைகளைப் புகாரளிக்கவும் எளிய இடம்.'}</p><div class="welcome-note">♧ &nbsp;Prototype only. Demo submissions are not sent to government departments.</div></div><div class="welcome-art" aria-hidden="true"><div class="art-sun"></div><div class="art-hill hill-back"></div><div class="art-hill hill-front"></div><div class="art-path"></div><div class="art-home"><div class="art-roof"></div><div class="art-door"></div><div class="art-window"></div></div><span class="art-label">a place to begin</span></div></section><section class="action-section"><div class="section-heading"><div><span class="eyebrow">YOUR NEXT STEP</span><h2>How can we help today?</h2></div><span class="section-caption">Choose an option to get started ↓</span></div><div class="action-grid">${['Report a problem','Track a request','Find a service','View alerts','Ask for help'].map((x,i)=>`<button class="action-card ${i===0?'action-featured':''}" data-page="${pages[i+1]}"><span class="action-icon">${['▤','⌕','↗','◉','?'][i]}</span><span class="action-card-title">${lang==='en'?x:labels.ta[i+1]} ↗</span><span class="action-card-desc">${['Tell us about a local issue.','Check a demo request’s progress.','Browse the service guide.','See clearly marked sample alerts.','Get answers about this prototype.'][i]}</span><span class="action-index">0${i+1}</span></button>`).join('')}</div></section><section class="how-section"><div class="how-intro"><span class="eyebrow">A CLEARER PATH</span><h2>How it works</h2><p>Choose a service or describe a local issue. Your information stays in this browser.</p><button class="text-link" data-page="services">Explore services →</button></div><div class="how-steps">${[['01','Tell us what you need','Choose an option that matches what you need.'],['02','Keep your reference number','Your DEMO reference helps you find a saved local record.'],['03','Follow your demo request','Updates in this prototype are simulated.']].map(x=>`<div class="how-step"><span class="step-number">${x[0]}</span><div><h3>${x[1]}</h3><p>${x[2]}</p></div><span>→</span></div>`).join('')}</div></section><section class="future-banner"><span class="future-icon">✳</span><div><span class="eyebrow">LOOKING AHEAD</span><h2>More ways to get support</h2><p>Verified local information, language support and approved integrations are future possibilities.</p></div><span class="future-tag">Future scope</span></section>`;
else if(current==='report')root.innerHTML=`<section class="form-page">${heading('LOCAL REPORT · DEMO ONLY',lang==='en'?'Tell us what’s happening.':'என்ன பிரச்சினை என்பதைச் சொல்லுங்கள்.',lang==='en'?'Share a little detail so you can see how local issue reporting could work.':'உள்ளூர் பிரச்சினையைப் புகாரளிக்கும் முறையை முயற்சிக்க சில விவரங்களைப் பகிருங்கள்.')}<form id="report-form" class="report-layout"><div class="form-main"><label class="field-label">What kind of problem is it? <span>Required</span></label><div class="category-grid">${['Pothole','Garbage','Broken streetlight','Drainage issue','Other'].map((x,i)=>`<button type="button" class="category-chip ${selected===x?'selected':''}" data-cat="${x}"><span class="category-symbol">${['↗','♻','◉','≈','＋'][i]}</span>${lang==='en'?x:['சாலைப் பள்ளம்','குப்பை','தெருவிளக்கு பழுது','வடிகால் பிரச்சினை','மற்றவை'][i]}</button>`).join('')}</div><label class="field-label" for="loc">Where is the problem? <span>Required</span></label><div class="input-wrap">⌖ <input id="loc" required placeholder="Street, neighbourhood or nearby landmark"></div><p class="field-hint">A nearby landmark can help describe the location.</p><label class="field-label" for="desc">Describe the problem <span>Required</span></label><textarea id="desc" required minlength="10" rows="5" placeholder="What did you notice? Add any details that may help."></textarea><span class="field-hint">Please enter at least 10 characters.</span><span class="field-label">Add a photo <span>Optional</span></span><label class="upload-box" for="photo">⇧ <span><strong>Choose a photo</strong><small>Preview stays on your device · JPG or PNG</small></span><input id="photo" type="file" accept="image/png,image/jpeg,image/webp"></label><div id="photo-preview"></div><p id="form-error" class="form-error" hidden></p><button class="button-primary submit-button">Save demo report →</button><p class="submit-footnote">♧ This stays in your browser. It does not contact a department.</p></div><aside class="form-aside"><span class="aside-icon">♧</span><span class="eyebrow">A NOTE ABOUT THIS FORM</span><h2>A safe place to try it out.</h2><p>Information you enter stays on this device as a demo record. Don’t include personal or sensitive details.</p><div class="aside-divider"></div><span class="aside-small">You’ll get a reference number that begins with <strong>DEMO-</strong></span></aside></form></section>`;
else if(current==='track')root.innerHTML=`<section class="content-page">${heading('REQUEST TRACKING · SIMULATED','Let’s find your request.','Enter a DEMO reference number to see its locally saved details and sample status.')}<form id="track-form" class="search-form"><label for="ref">Reference number</label><div class="search-row"><div class="input-wrap">⌕ <input id="ref" placeholder="For example, DEMO-24A7KQ"></div><button class="button-primary">Find request →</button></div><p class="field-hint">Try sample: <button type="button" class="inline-link" id="fill-sample">DEMO-24A7KQ</button></p></form><div id="track-result"><div class="sample-hint"><span class="sample-pill">SAMPLE</span><div><strong>Try a sample request</strong><p>This example shows simulated updates for a streetlight report.</p></div><button class="text-link" id="view-sample">View sample →</button></div></div></section>`;
else if(current==='services'){root.innerHTML=`<section class="content-page">${heading('SERVICE GUIDE · SAMPLE CONTENT','A guide to finding services.','Browse plain-language starting points. Check the relevant official source for information in your area.')}<div class="service-tools"><div class="input-wrap">⌕ <input id="service-search" placeholder="Search the guide"></div><div class="filter-tabs" id="filters">${['All','Local services','Public information','Schemes'].map((x,i)=>`<button class="filter-tab ${i===0?'selected':''}" data-filter="${x}">${x}</button>`).join('')}</div></div><div class="verification-note">♧ &nbsp;No location or jurisdiction is selected. Entries below are sample placeholders; no eligibility, benefit, deadline or procedure claims are made.</div><div id="service-list" class="service-list"></div></section>`;drawServices('All','')}
else if(current==='alerts')root.innerHTML=`<section class="content-page">${heading('ALERTS · DEMO EXAMPLES','Local updates, clearly marked.','This prototype has no live or verified alert feed. These examples are fictional demonstrations.')}<div class="alert-demo-banner"><span class="alert-mark">◉</span><div><strong>Sample content only</strong><p>These examples are not current, verified or sourced from an official alert service.</p></div></div><div class="alert-list">${[['Example · Moderate','Sample road access notice','A fictional demonstration of a local update. This is not an active road closure.'],['Example · Important','Sample public service notice','A fictional example showing where service updates could appear once an official source is connected.']].map(x=>`<article class="alert-card"><div class="alert-card-top"><span class="urgency-tag amber">${x[0]}</span><span class="sample-pill">DEMO</span></div><h2>${x[1]}</h2><p>${x[2]}</p><div class="alert-details"><span>⌖ Example area · not a real location</span><span>◷ Sample date · not current</span></div><small>Source: Demo content created for this prototype</small></article>`).join('')}</div></section>`;
else root.innerHTML=`<section class="content-page help-page">${heading('HELP · LOCAL DEMO ANSWERS','What can we help you with?','Ask about using this prototype or choose a common question. Answers come from local demo information.')}<div class="help-panel"><div class="help-panel-head"><span class="help-symbol">?</span><div><strong>Prototype help</strong><span>Local answers · no live AI connected</span></div><span class="offline-dot">● Offline</span></div><div class="chat-area" id="answer-area"><div class="assistant-intro"><span class="assistant-small-icon">?</span><div><strong>Hello. I can help you find your way around.</strong><p>Choose a question below or type one about the demo.</p></div></div><div class="question-chips">${['Does this submit a real complaint?','How do I track a request?','Where does my report go?','Can I get scheme eligibility advice?'].map(x=>`<button data-question="${x}">${x} ↗</button>`).join('')}</div></div><form class="chat-input" id="chat-form"><input id="chat-question" placeholder="Ask about using this prototype…"><button class="button-primary">→</button></form></div><p class="help-footnote">♧ If we can’t answer from this sample information, we’ll point you to an official source. Never include private or sensitive details.</p></section>`;
wire()}
function showSuccess(item){document.querySelector('#main-content').innerHTML=`<section class="form-page success-wrap"><div class="success-card"><span class="success-check">✓</span><span class="eyebrow">DEMO RECORD SAVED</span><h1>Your report is saved in this browser.</h1><p>This is a local prototype record. It was not sent to a government department and no one has been assigned to it.</p><div class="reference-box"><span>YOUR REFERENCE NUMBER</span><strong>${esc(item.ref)}</strong><small>Keep this number to find the demo record later.</small></div><div class="button-row"><button class="button-primary" data-page="track">Track this request →</button><button class="button-secondary" data-page="report">Report another issue</button></div></div></section>`;wire()}
function showTracking(item){let states=['Submitted','Assigned','In Progress'],last=states.indexOf(item.status);document.querySelector('#track-result').innerHTML=`<article class="tracking-card"><div class="tracking-top"><div><span class="eyebrow">${item.ref===sample.ref?'SAMPLE COMPLAINT':'LOCAL DEMO RECORD'}</span><h2>${esc(item.category)}</h2></div><span class="status-pill"><span></span>${item.status}</span></div><div class="tracking-meta"><span>⌖ ${esc(item.location)}</span><span>◷ ${esc(item.submitted)}</span></div><p class="tracking-description">${esc(item.description)}</p><div class="timeline-heading"><h3>Status timeline</h3><span>Simulated updates</span></div><div class="timeline">${states.map((s,i)=>`<div class="timeline-step ${i<=last?'completed':''}"><span class="timeline-dot">${i<last?'✓':i===last?'•':''}</span><div><strong>${s}</strong><small>${i===0?esc(item.submitted):i<=last?'Demo update':'Not yet reached'}</small></div></div>`).join('')}</div></article>`}
function drawServices(filter,search){let list=services.filter(x=>(filter==='All'||x[0]===filter)&&x.join(' ').toLowerCase().includes(search.toLowerCase()));let root=document.querySelector('#service-list');if(root)root.innerHTML=list.length?list.map(x=>`<article class="service-card"><div class="service-card-top"><span class="service-type">${x[0]}</span><span class="sample-pill">SAMPLE</span></div><h2>${x[1]}</h2><p>${x[2]}</p><div class="service-next"><strong>Next step</strong><span>${x[3]}</span></div><small class="source-line">Sample guide · awaiting official source</small></article>`).join(''):'<div class="empty-state"><span class="empty-icon">⌕</span><h2>No matching entries</h2><p>Try another search or select a different category.</p></div>'}
function answer(q){let a='I don’t have verified information for that. Please check the relevant official government website or contact channel for your area.';if(/real complaint|where does/i.test(q))a='No. This is a frontend prototype. A report is saved only in this browser and is not sent to any government department.';if(/track/i.test(q))a='After saving a demo report, copy its DEMO- reference number. Open “Track a request” and enter that number. Updates are simulated.';if(/scheme/i.test(q))a='This prototype does not include verified scheme rules or eligibility details. Please use the relevant department’s official website or contact channel.';document.querySelector('#answer-area').innerHTML=`<div class="chat-bubble user-bubble">${esc(q)}</div><div class="chat-bubble answer-bubble"><span class="answer-label">DEMO ANSWER</span>${esc(a)}</div>`}
function wire(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{selected=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(n=>n.classList.toggle('selected',n.dataset.cat===selected))});let f=document.querySelector('#report-form');if(f){f.onsubmit=e=>{e.preventDefault();let loc=document.querySelector('#loc').value.trim(),desc=document.querySelector('#desc').value.trim(),err=document.querySelector('#form-error');if(!selected||!loc||desc.length<10){err.textContent='Please select a category, enter a location, and add a description of at least 10 characters.';err.hidden=false;return}let item={ref:'DEMO-'+Math.random().toString(36).slice(2,8).toUpperCase(),category:selected,location:loc,description:desc,submitted:new Date().toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}),status:'Submitted'};records=[item,...records];localStorage.setItem('common-ground-demo-complaints',JSON.stringify(records));showSuccess(item)};document.querySelector('#photo').onchange=e=>{let file=e.target.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>document.querySelector('#photo-preview').innerHTML=`<div class="photo-preview"><img src="${reader.result}" alt="Selected photo preview"><span>${esc(file.name)} · local preview only</span></div>`;reader.readAsDataURL(file)}}let tf=document.querySelector('#track-form');if(tf){tf.onsubmit=e=>{e.preventDefault();let q=document.querySelector('#ref').value.trim().toUpperCase();let item=[...records,sample].find(x=>x.ref===q);document.querySelector('#track-result').innerHTML=item?'':'<div class="empty-state"><span class="empty-icon">⌕</span><h2>We couldn’t find that reference.</h2><p>Check the number and try again. Only demo requests saved in this browser and the sample record can be found.</p></div>';if(item)showTracking(item)};document.querySelector('#fill-sample').onclick=()=>document.querySelector('#ref').value=sample.ref;document.querySelector('#view-sample').onclick=()=>showTracking(sample)}let ss=document.querySelector('#service-search');if(ss){let filter='All';ss.oninput=()=>drawServices(filter,ss.value);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(n=>n.classList.toggle('selected',n===b));drawServices(filter,ss.value)})}document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>answer(b.dataset.question));let cf=document.querySelector('#chat-form');if(cf)cf.onsubmit=e=>{e.preventDefault();let q=document.querySelector('#chat-question').value.trim();if(q)answer(q)}}
document.querySelector('#language').onclick=()=>{lang=lang==='en'?'ta':'en';nav();render()};document.querySelector('#menu').onclick=()=>{let m=document.querySelector('#mobile-nav');m.hidden=!m.hidden;nav()};nav();render();
</script></body></html>
